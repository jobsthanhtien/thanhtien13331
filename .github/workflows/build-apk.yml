name: 🚀 Build DZUx Lazada Hunter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🤖 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sync Python & Web sources to Android project
        run: |
          python sync_to_android.py

      - name: 🔨 Generate Gradle Wrapper & Build APK
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 📦 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DZUx-Lazada-Hunter-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
